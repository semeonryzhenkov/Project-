<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interior Planner - Планировщик интерьеров</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar - Project Manager -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>Interior Planner</h1>
            </div>
            <div class="project-controls">
                <button id="newProjectBtn" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 0a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2H9v6a1 1 0 1 1-2 0V9H1a1 1 0 0 1 0-2h6V1a1 1 0 0 1 1-1z"/>
                    </svg>
                    Новый проект
                </button>
            </div>
            <div class="projects-list">
                <h2>Проекты</h2>
                <ul id="projectsList"></ul>
            </div>
            <div class="selected-project-info" id="selectedProjectInfo" style="display: none;">
                <h3>Текущий проект</h3>
                <p id="currentProjectName"></p>
                <div class="project-actions">
                    <button id="duplicateProjectBtn" class="btn btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H6zM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1H2z"/>
                        </svg>
                        Копировать
                    </button>
                    <button id="deleteProjectBtn" class="btn btn-danger">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                            <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                        </svg>
                        Удалить
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Toolbar -->
            <header class="toolbar">
                <div class="tool-group">
                    <button id="selectTool" class="tool-btn active" title="Выделение">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
                        </svg>
                        <span>Выбор</span>
                    </button>
                    <button id="wallTool" class="tool-btn" title="Стена">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"/>
                        </svg>
                        <span>Стена</span>
                    </button>
                    <button id="windowTool" class="tool-btn" title="Окно">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="8" width="18" height="8" rx="1"/>
                            <line x1="12" y1="8" x2="12" y2="16"/>
                        </svg>
                        <span>Окно</span>
                    </button>
                    <button id="doorTool" class="tool-btn" title="Дверь">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="10" height="18"/>
                            <path d="M13 21a8 8 0 0 0 8-8"/>
                        </svg>
                        <span>Дверь</span>
                    </button>
                </div>
                <div class="tool-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="snapToGrid" checked>
                        <span>Привязка к сетке</span>
                    </label>
                </div>
                <div class="tool-info" id="toolInfo">
                    Выберите инструмент для начала работы
                </div>
            </header>

            <!-- Canvas Container -->
            <div class="canvas-container">
                <canvas id="planCanvas"></canvas>
            </div>

            <!-- Properties Panel -->
            <aside class="properties-panel" id="propertiesPanel" style="display: none;">
                <h3>Свойства</h3>
                <div id="propertiesContent"></div>
            </aside>
        </main>
    </div>

    <!-- Modal for new project -->
    <div id="modalOverlay" class="modal-overlay" style="display: none;">
        <div class="modal">
            <h2 id="modalTitle">Новый проект</h2>
            <input type="text" id="modalInput" placeholder="Название проекта" autofocus>
            <div class="modal-actions">
                <button id="modalCancelBtn" class="btn btn-secondary">Отмена</button>
                <button id="modalConfirmBtn" class="btn btn-primary">OK</button>
            </div>
        </div>
    </div>

    <!-- Room name input overlay -->
    <div id="roomNameInput" class="room-name-input" style="display: none;">
        <input type="text" id="roomNameField" placeholder="Название комнаты">
    </div>

    <script src="app.js"></script>
</body>
</html>
